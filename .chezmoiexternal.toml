[pocock]
	type = "archive"
	url = "https://github.com/mattpocock/skills/archive/main.tar.gz"
	exact = false
	include = [
		"skills-main/skills/engineering/tdd/*",
		"skills-main/skills/productivity/grill-me/*",
		"skills-main/skills/productivity/handoff/*"
	]
	stripComponents=3
	targetPath = ".config/opencode/skills"
[superpowers]
	type = "archive"
	url = "https://github.com/obra/superpowers/archive/main.tar.gz"
	exact = false
	include = [
		"superpowers-main/skills/subagent-driven-development/*"
	]
	targetPath = ".config/opencode/skills"
	stripComponents=2
